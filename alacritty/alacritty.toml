[env]
TERM = "xterm-256color"

[font]
size = 12

offset.y = 2

  [font.normal]
  family = "Hack Nerd Font Mono"
  style = "Regular"

[[keyboard.bindings]]
chars = "\u00021"
key = "Key1"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00022"
key = "Key2"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00023"
key = "Key3"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00024"
key = "Key4"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00025"
key = "Key5"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00026"
key = "Key6"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00027"
key = "Key7"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00028"
key = "Key8"
mods = "Command"

[[keyboard.bindings]]
chars = "\u00029"
key = "Key9"
mods = "Command"

[[keyboard.bindings]]
key = 'm'
mods = 'Command'
action = 'ToggleMaximized'

[[keyboard.bindings]]
key = 'm'
mods = 'Command | shift'
action = 'ToggleFullscreen'

[[keyboard.bindings]]
key = 'j'
mods = 'control | shift'
chars = '\x1b[74;5u'

[[keyboard.bindings]]
key = 'k'
mods = 'control | shift'
chars = '\x1b[75;5u'

[[keyboard.bindings]]
key = 'h'
mods = 'control | shift'
chars = '\x1b[72;5u'

[[keyboard.bindings]]
key = 'l'
mods = 'control | shift'
chars = '\x1b[76;5u'

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 0.8
blur = true

  [window.padding]
  x = 5
  y = 5

[general]
live_config_reload = true
import = [
  "/opt/homebrew/lib/node_modules/alacritty-themes/themes/One-Dark.toml"
]
