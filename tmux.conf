# run-shell "powerline-daemon -q"
# source "/usr/lib/python3.6/site-packages/powerline/bindings/tmux/powerline.conf"

#####################################
# GENERAL
#####################################

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# set the clipboard mode. setting to external will hand off copy/paste to the terminal
set -s set-clipboard external

#####################################
# Plugins
#####################################


# List of plugins
# In order to install new plugins added here, resource the config file and press prefix + I
set -g @tpm-plugins '
    'tmux-plugins/tpm' \
    'tmux-plugins/tmux-sensible' \
    'tmux-plugins/tmux-resurrect' \
    'tmux-plugins/tmux-continuum' \
    'tmux-plugins/tmux-yank' \
    'soyuka/tmux-current-pane-hostname' \
    'thewtex/tmux-mem-cpu-load' \
'

set -sg escape-time 1
set -g base-index 1
set -g pane-base-index 1
#set -g window-base-index 1


#####################################
# KEYBINDINGS
#####################################

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# creating and moving in splits
bind - split-window -v
bind _ split-window -h

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind C-h
unbind C-j
unbind C-k
unbind C-l

bind -n C-S-h run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-S-j run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-S-k run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-S-l run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"

# --------------------
# fuzzy finding sessions
# --------------------
bind-key "o" run-shell "sesh connect \"$(
    sesh list | fzf-tmux -p 55%,60% \
        --no-sort --border-label ' sesh ' --prompt '⚡  ' \
        --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
        --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
        --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
        --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
        --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""

# --------------------
# saving and opening tmux sessions to and from disk
# --------------------
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-save M-s
set -g @resurrect-restore M-r

# --------------------
# open new panes in current directory
# --------------------
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# -----------------------------------
# Mouse mode settings
# -----------------------------------

set-window-option -g mouse
set -g history-limit 30000
# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 50

# to enable mouse scroll, see https://github.com/tmux/tmux/issues/145#issuecomment-150736967
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
# instead of scrolling one line scroll half the page
bind -Tcopy-mode WheelUpPane send halfpage-up
bind -Tcopy-mode WheelDownPane send halfpage-down

bind -Tcopy-mode C-Up send -X scroll-up

# ---------------------
# Copy & Paste
# ---------------------
# provide access to the clipboard for pbpaste, pbcopy
# set-option -g default-command "reattach-to-user-namespace -l zsh"
# set-window-option -g automatic-rename on
#
# # use vim keybindings in copy mode
# setw -g mode-keys vi
#
# setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection

# bind-key -t vi-copy v begin-selection
# bind-key -t vi-copy y copy-pipe "reattach-to-user-namespace pbcopy"
#
# # update default binding of 'Enter' to also use copy-pipe
# unbind -t vi-copy Enter
# bind-key -t vi-copy Enter copy-pipe "reattach-to-user-namespace pbcopy"
#
# bind y run 'tmux save-buffer - | reattach-to-user-namespace pbcopy '
# bind C-y run 'tmux save-buffer - | reattach-to-user-namespace pbcopy '
#
# ----------------------
# set some pretty colors
# ----------------------
# set pane colors - hilight the active pane
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# colorize messages in the command line
set-option -g message-style fg=yellow

# ----------------------
# Status Bar
# -----------------------
set-option -g status on                # turn the status bar on
set -g status-interval 5               # set update frequencey (default 15 seconds)
set -g status-justify left           # center window list for clarity
set-option -g status-position bottom    # position the status bar at top of screen

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# set color for status bar
set-option -g status-bg colour235 #base02
set-option -g status-fg yellow #yellow

# set window list colors - red for active and cyan for inactive
set-window-option -g window-status-style fg=green
set-window-option -g window-status-current-style fg=green,bold

# show host name and IP address on left side of status bar
# set -g status-left-length 70
# TMUX_PLUGIN_MANAGER_PATH
set -g status-left "#[fg=green]:: #[default]"
# set -g status-right '#[fg=green]:: #H :: #[fg=yellow]#S :: #[fg-yellow]#(gitmux -cfg $HOME/dotfiles/gitmux.conf "#{pane_current_path}" --interval 2) #[default]'
set -g status-right '#[fg=yellow]#S :: #[fg-yellow]#(gitmux -cfg $HOME/dotfiles/gitmux.conf "#{pane_current_path}" --interval 2) #[default] #[fg=green]:: #H ::'

# show session name, window & pane number, date and time on right side of
# status bar
set -g status-right-length 120
# set -g status-right "#[fg=yellow]#(tmux-mem-cpu-load --interval 2) #[fg=green]:: %d %b %Y :: %H:%M:%S ::"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
